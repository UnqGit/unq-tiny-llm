[package]
name = "unq-tiny-llm"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.12.0"
regex = "1.13.1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
unicode-normalization = "0.1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "bpe_benchmark"
harness = false

[[bench]]
name = "encoder_benchmark"
harness = false

[[bench]]
name = "decoder_benchmark"
harness = false

[[bench]]
name = "bpe_fast_bench"
harness = false