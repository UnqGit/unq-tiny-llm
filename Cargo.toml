[package]
name = "unq-tiny-llm"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
unicode-normalization = "0.1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "bpe_benchmark"
harness = false

[[bench]]
name = "tokenizer_init_benchmark"
harness = false